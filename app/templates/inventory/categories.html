{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Categories</h1>
  <a href="{{ url_for('inventory.products') }}" class="btn btn-sm">Back</a>
</div>

<form method="post" class="card" style="margin-bottom:14px; display:flex; gap:8px; align-items:flex-end;">
  <div style="flex:1;">
    <label>New Category</label>
    <input type="text" name="name" placeholder="e.g. Frozen Goods" required style="margin-bottom:0;">
  </div>
  <button type="submit" class="btn btn-primary">Add</button>
</form>

<div class="list">
  {% for category in categories %}
  <div class="list-row">
    <div class="name">{{ category.name }}</div>
    <form method="post" action="{{ url_for('inventory.delete_category', category_id=category.id) }}" onsubmit="return confirm('Delete this category?');">
      <button type="submit" class="btn btn-sm btn-danger">Delete</button>
    </form>
  </div>
  {% else %}
  <p class="muted">No categories yet.</p>
  {% endfor %}
</div>
{% endblock %}
