{% extends "base.html" %}
{% block title %}{{ "Edit" if product else "New" }} Product{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ "Edit" if product else "New" }} Product</h1>
  <a href="{{ url_for('inventory.products') }}" class="btn btn-sm">Back</a>
</div>

<form method="post" class="card">
  <label>Name</label>
  <input type="text" name="name" value="{{ product.name if product else '' }}" required>

  <label>Barcode</label>
  <div style="display:flex; gap:8px;">
    <input type="text" id="barcode" name="barcode" value="{{ product.barcode if product else '' }}" placeholder="Scan or type barcode">
    <button type="button" class="btn btn-sm" id="open-scanner" style="white-space:nowrap;">📷 Scan</button>
  </div>

  <label>Category</label>
  <select name="category_id">
    <option value="">Uncategorized</option>
    {% for category in categories %}
    <option value="{{ category.id }}" {% if product and product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
    {% endfor %}
  </select>

  <label>Price ($)</label>
  <input type="number" step="0.01" min="0" name="price" value="{{ '%.2f'|format(product.price) if product else '0.00' }}" required>

  <label>Stock Quantity</label>
  <input type="number" min="0" name="stock_qty" value="{{ product.stock_qty if product else 0 }}" required>

  <label>Low Stock Threshold</label>
  <input type="number" min="0" name="low_stock_threshold" value="{{ product.low_stock_threshold if product else 5 }}" required>

  {% if product %}
  <label style="display:flex; align-items:center; gap:8px;">
    <input type="checkbox" name="is_active" style="width:auto; margin:0;" {% if product.is_active %}checked{% endif %}>
    Active
  </label>
  {% endif %}

  <button type="submit" class="btn btn-primary btn-block">Save Product</button>
</form>

{% if product %}
<form method="post" action="{{ url_for('inventory.delete_product', product_id=product.id) }}" onsubmit="return confirm('Delete this product?');" style="margin-top:12px;">
  <button type="submit" class="btn btn-danger btn-block">Delete Product</button>
</form>
{% endif %}

<div class="scanner-modal hidden" id="scanner-modal">
  <div class="scanner-box">
    <div id="scanner-reader"></div>
    <button type="button" class="btn btn-block scanner-close" id="close-scanner">Close Scanner</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const scannerModal = document.getElementById('scanner-modal');
  const barcodeInput = document.getElementById('barcode');
  let html5QrCode;

  document.getElementById('open-scanner').addEventListener('click', () => {
    scannerModal.classList.remove('hidden');
    html5QrCode = new Html5Qrcode("scanner-reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 220 },
      (decodedText) => {
        barcodeInput.value = decodedText;
        stopScanner();
      }
    ).catch((err) => {
      alert("Camera access failed: " + err);
      stopScanner();
    });
  });

  function stopScanner() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
    }
    scannerModal.classList.add('hidden');
  }

  document.getElementById('close-scanner').addEventListener('click', stopScanner);
</script>
{% endblock %}
